schema_version = 1
id = "blue-chairs"
kind = "adventure"
title = "Blue Chairs"
description = "Twenty-three dollars for the best dream of your life: one green drink in a party attic, and the night goes a long, strange way from there."
year = 2004
license = "CC-BY-NC-SA-3.0"
repo = "theasciiverse/stories"
provenance = "Chris Klimas wrote Blue Chairs in 2004. It came second in that year's Interactive Fiction Competition and won Best Game at the 2004 XYZZY Awards."
changes = "blue-chairs/README.md"            # what Asciiverse changed, a path in repo
topics = ["text-adventure", "surreal", "dream", "story"]
genre = "text adventure"

[developer]
name = "Chris Klimas"
url = "https://ifarchive.org/if-archive/games/competition2004/zcode/bluechairs/"

# Chris Klimas' 2004 game: second place in the 2004 Interactive Fiction Competition and Best Game at the 2004 XYZZY Awards.
# The story file is unchanged (provenance and sha256 in the stories repo,
# blue-chairs/README.md); played with Frotz 2.55, which comes inside the archive.
[upstream]
name = "Chris Klimas, 2004"
url = "https://ifarchive.org/if-archive/games/competition2004/zcode/bluechairs/"

# the start script plays the story in the bundled Frotz; saves go to
# ~/.local/share/blue-chairs
[exec]
game = "blue-chairs"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

[media]
cast = "asciiverse/blue-chairs.cast"
thumbnail_at = 14.2

[release]
source = "github"
