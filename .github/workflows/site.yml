# Builds catalog.json from catalog/ and the titles' GitHub Releases
# (tools/build_catalog.py, catalog/SCHEMA.md) and deploys the website with
# it to Cloudflare Pages, project "asciiverse", served at asciiverse.sh.
#
# Runs every 6 hours, so new title releases reach av without a change here,
# on every push that touches the catalog or the site, and by hand.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.

name: site

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [master]
    paths:
      - "catalog/**"
      - "site/**"
      - "tools/build_catalog.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a newer run waits rather than racing an older one
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: build_catalog.py dates each title from it

      - name: Assemble the site
        run: |
          mkdir public
          cp -r site/. public/
          rm -rf public/dev public/DESIGN.md public/.gitignore public/data/catalog.json
          # stamp our own scripts and styles with this commit, so a deploy is
          # always new URLs and no browser pairs a new page with an old site.js
          # (Cloudflare's 4-hour browser cache overrides Cache-Control headers)
          v=$(git rev-parse --short HEAD)
          sed -i -E "s#(src|href)=\"(js|css)/([^\"?]+)\"#\\1=\"\\2/\\3?v=$v\"#g" public/*.html
          grep -c "site.js?v=$v" public/index.html

      - name: Build catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 --version
          python3 tools/build_catalog.py --out public/data/catalog.json \
            --previous https://asciiverse.sh/data/catalog.json

      # link-preview pictures, one per title from its preview's still frame;
      # kept between runs by each cast's content stamp, so only new or
      # changed casts are rendered (all of them took 33 s on 6 cores)
      - name: Restore posters
        uses: actions/cache@v4
        with:
          path: .posters
          key: posters-${{ hashFiles('site/casts/*.cast') }}
          restore-keys: posters-

      - name: Render posters
        run: python3 tools/posters.py public .posters

      # each title's own page at /t/<id>/ with its text in the HTML, the
      # home and category pages' title lists, sitemap.xml and robots.txt,
      # so search engines and link previews see the games
      - name: Build static pages
        run: python3 tools/build_pages.py public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=asciiverse --branch=main --commit-dirty=true
