schema_version = 1
id = "cataclysm2"
kind = "game"
title = "Cataclysm II"
description = "Whales' unfinished alpha rewrite of the zombie survival roguelike Cataclysm: wash up on a beach, make your way to town and fight what is left of it"
year = 2013
# LICENSE is the GPL version 3 text and data/motd.txt says "licensed
# under the GPLv3"; nothing in the sources says "or any later version"
license = "GPL-3.0-only"
repo = "theasciiverse/cataclysm2"
provenance = "Whales wrote Cataclysm II from 2013 to 2016 as a ground-up rewrite of Cataclysm, the roguelike Whales wrote from 2010 to 2013, and left it an early alpha. It is a separate project from Cataclysm: Dark Days Ahead, the community fork of the first Cataclysm."
changes = "PATCHES.md"
topics = ["roguelike", "survival", "zombies", "post-apocalyptic", "alpha", "curses"]
genre = "roguelike"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[upstream]
name = "Whales"
url = "https://github.com/Whales/Cataclysm2"

[exec]
game = "cataclysm2"

# the menus and character creation are fixed 80x24 screens (cuss/*.cuss);
# measured in tmux: at 80x24 the game screen is a 24x24 map and the
# 55-column HUD, and smaller terminals clip the menus
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

# 100x30, played by asciiverse/record/cataclysm2.py (best of several
# takes): the first screen with its early alpha notice, a Survivalist with
# a hatchet, the world map, then a walk to the nearest town and a fight
# with its zombies; 52 s, ending on Q. The still is the town's edge with
# two zombies coming and the kills in the message log
[media]
cast = "asciiverse/casts/cataclysm2.cast"
thumbnail_at = 30.0

[release]
source = "github"
