schema_version = 1
id = "ceres"
kind = "game"
title = "Ceres"
description = "Three thousand metres of ice, spikes and howling wind, and one dash to get you over them! Jump, dash and wall-kick to the summit of Ceres Mountain. How many times will you fall?"
year = 2015
license = "MIT"
repo = "theasciiverse/ceres"
provenance = "Maddy Thorson and Noel Berry made Celeste Classic for the PICO-8 in four days in 2015, the seed of Celeste (2018); this climb runs their code and levels, frame for frame, with new art and music."
topics = ["platformer", "restoration", "pico-8", "precision"]
genre = "platformer"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[upstream]
name = "Maddy Thorson and Noel Berry"
url = "https://www.lexaloffle.com/bbs/?tid=2145"

[exec]
game = "ceres"
args = []

# no [min_terminal]: it scales to the terminal and checks no minimum

[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = true

system_deps = ["libasound2", "libudev1"]

[media]
cast = "asciiverse/ceres.cast"
thumbnail_at = 12.0

[release]
source = "github"
