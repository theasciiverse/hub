schema_version = 1
id = "fur-trader"
kind = "game"
title = "Fur Trader"
description = "Eight seasons trading furs on Lake Ontario in the 1700s: outfit a canoe, winter in the upper country, then run for Fort Frontenac, Montreal or Albany and make your fortune."
year = 1973
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "Dan G. Bachor of the University of Calgary wrote Fur Trader, a trading expedition from Lake Ontario, printed in David H. Ahl's 101 BASIC Computer Games (1973) and BASIC Computer Games (1978). Asciiverse rebuilt it from its rules in 2026."
topics = ["trading", "history", "economy", "turn-based", "basic-computer-games", "classic"]
genre = "trading"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "fur-trader"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/fur-trader.cast"
thumbnail_at = 6.0

[release]
source = "github"
