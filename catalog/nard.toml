schema_version = 1
id = "nard"
kind = "game"
title = "Nard"
description = "Fifteen men, two dice and a neural-network opponent that pounces on your blots and turns the cube on you: backgammon by its Persian name, on an inlaid bazaar board. Double! Will you take?"
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/nard"
provenance = "Nard is the Persian name of backgammon, still its name from Iran to Russia; Asciiverse built this board in 2026, with Mark Higgins' bgsage engine as the opponent and Pouya Hadidi's Backgammon TUI as the look."
topics = ["board", "backgammon", "dice", "doubling cube", "vs-computer", "hot-seat"]
genre = "board"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "nard"
args = []

# the game's own check; larger points and the ornament from bigger sizes up
[min_terminal]
cols = 100
rows = 26

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = false
glyphs = ["braille"]

# the engine is C++; on Intel and AMD it needs AVX2 (2013 or newer)
system_deps = ["libstdc++6"]

[media]
cast = "asciiverse/nard.cast"
thumbnail_at = 24.0

[release]
source = "github"
