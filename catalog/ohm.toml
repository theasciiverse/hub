schema_version = 1
id = "ohm"
kind = "game"
title = "Ohm's Workshop"
description = "The old master's workshop is yours now. Fix the town's gadgets with real circuits and watch them glow, click and blink... or smoke, sizzle and pop!"
year = 2026
new = true
license = "GPL-3.0-or-later"
repo = "theasciiverse/ohm"
provenance = "Asciiverse made Ohm's Workshop in Rust in 2026, in the family of SHENZHEN I/O, Retro Gadgets and Turing Complete, with a real circuit solver at its heart."
topics = ["puzzle", "electronics", "simulation", "teaching"]
genre = "puzzle"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "ohm"
args = []

# render.rs MIN_W and MIN_H; below it asks for a bigger terminal
[min_terminal]
cols = 100
rows = 30

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

[media]
cast = "asciiverse/ohm.cast"
thumbnail_at = 21.5

[release]
source = "github"
