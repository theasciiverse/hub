schema_version = 1
id = "lunar-descent"
kind = "game"
title = "Lunar Descent"
description = "120 miles above the Moon and falling at 3,600 miles an hour: work the throttle of your one engine and set the craft down softly before 16,500 pounds of fuel run dry."
year = 1969
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "Jim Storer wrote Lunar in FOCAL at Lexington High School in the autumn of 1969, months after Apollo 11; in BASIC Computer Games David H. Ahl called the lunar landing game the most popular computer game of its day. Asciiverse rebuilt it from its rules in 2026."
topics = ["lander", "space", "moon", "physics", "simulation", "basic-computer-games", "classic"]
genre = "simulation"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "lunar-descent"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 76
rows = 22

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/lunar-descent.cast"
thumbnail_at = 18.0

[release]
source = "github"
