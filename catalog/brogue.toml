schema_version = 1
id = "brogue"
kind = "game"
title = "Brogue CE"
description = "A beautiful, tightly designed roguelike: 26 levels down to the Amulet of Yendor, no classes and no grinding, just what you find, what you learn and the allies you free along the way."
year = 2009
featured = 4             # place in the website's carousel, 1 first
license = "AGPL-3.0-or-later"
repo = "theasciiverse/brogue"
provenance = "Brian Walker made Brogue from 2009 to 2018; since 2019 a community team has kept it going as Brogue: Community Edition."
changes = "PATCHES.md"
topics = ["roguelike", "dungeon", "fantasy", "turn-based", "classic"]
genre = "roguelike"

[developer]
name = "The Brogue CE team"
url = "https://github.com/tmewett/BrogueCE"

# v1.15.1, the terminal (ncurses) build, unchanged; the start script runs
# it from ${XDG_DATA_HOME:-~/.local/share}/Brogue, where it keeps saves,
# recordings and high scores
[upstream]
name = "Brian Walker and the Brogue CE team"
url = "https://github.com/tmewett/BrogueCE"

[exec]
game = "brogue"

# the screen is a fixed 100x34; in a smaller terminal Brogue asks the
# window to grow and otherwise waits, showing the size it needs
[min_terminal]
cols = 100
rows = 34

# 256 colours when the terminal has them, else 16; keyboard only in the
# terminal build
[requires]
utf8 = false
color = "256"
mouse = false

# 100x34 (the game's own size), asciiverse/record-preview.py: the title's
# flames, then a pilot that explores (x) and fights rats, jackals and a
# kobold on the first level, then quits to the gravestone; cropped to
# 100x30 following the player (RECORDING.md); the still is the jackal and
# kobold fight
[media]
cast = "asciiverse/brogue.cast"
thumbnail_at = 29.0
crop = { follow = "player" }

[release]
source = "github"
