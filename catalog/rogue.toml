schema_version = 1
id = "rogue"
kind = "game"
title = "Rogue"
description = "The game that named the roguelikes: the guild sends you into the Dungeons of Doom for the Amulet of Yendor, 26 levels down, and death is for good."
year = 1980
# BSD licence plus the source's own notice that it "is not to be traded,
# sold, or used for personal gain or profit"; SPDX has no id for that
license = "LicenseRef-Free-Noncommercial"
repo = "theasciiverse/netbsd-games"
collection = "bsdgames"
provenance = "Timothy Stoehr's rewrite of Rogue 5.3, the game by Michael C. Toy, Kenneth C. R. C. Arnold and Glenn Wichman; he mailed Kirk McKusick at Berkeley about it in 1987, and it has been part of BSD since."
changes = "PATCHES.md"
topics = ["roguelike", "dungeon", "rpg", "classic", "curses"]
genre = "roguelike"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[upstream]
name = "Timothy Stoehr, after Michael C. Toy, Kenneth C. R. C. Arnold and Glenn Wichman"
url = "https://github.com/NetBSD/src/tree/trunk/games/rogue"

[exec]
game = "rogue"

# rogue refuses a terminal smaller than 80x24 ("must be played on at
# least 80 x 24 screen")
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

# 100x30, the first level explored by asciiverse/record/rogue.py, which
# walks to items, doors and unexplored ends, fights what it meets and
# rests when hurt; 48 s, ending on the score table; the still has three
# rooms and their corridors mapped
[media]
cast = "asciiverse/casts/rogue.cast"
thumbnail_at = 38.0

[release]
source = "github"
