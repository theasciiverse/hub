schema_version = 1
id = "royal-ur"
kind = "game"
title = "Royal Game of Ur"
description = "Race seven pieces past the rosettes of a 4,500-year-old board, knock rivals back to the start, and fight for the middle square, in four reconstructions down to the Babylonian tablet's betting game!"
year = 2026
new = true
license = "GPL-3.0-or-later"
repo = "theasciiverse/ancient-games"
provenance = "Played at Ur around 2600 BC; its rules survive on a Babylonian tablet of 177 or 176 BC, long filed as bird omens, read by Irving Finkel; Asciiverse brought four reconstructions to the terminal in 2026."
topics = ["board", "race", "dice", "ancient", "history", "vs-computer", "hot-seat"]
genre = "board"
collection = "ancient-games"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

