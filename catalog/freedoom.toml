schema_version = 1
id = "freedoom"
kind = "game"
title = "Freedoom"
description = "The 1993 first-person shooter's engine in your terminal, in full colour, with music and sound, playing Freedoom's two free games: fight through bases and hells with shotgun and chaingun."
year = 1993
old = true
license = "GPL-2.0-or-later AND BSD-3-Clause"
repo = "theasciiverse/freedoom"
provenance = "id Software released the source of its 1993 engine in 1997; Chocolate Doom and doomgeneric carried it on, and Wojciech Graj brought it to the terminal in 2022. The Freedoom project has made free levels, monsters, sounds and music for it since 2001."
changes = "PATCHES.md"
topics = ["shooter", "first-person", "fps", "freedoom", "classic", "music", "gamepad"]
genre = "action"

[developer]
name = "The Freedoom project and Wojciech Graj"
url = "https://freedoom.github.io"

# Freedoom on the doom-ascii 0.3.2 engine, with our sound effects and OPL
# music (miniaudio and Chocolate Doom's OPL code), exact key releases
# through the kitty keyboard protocol and the half-block picture (-chars half); Freedoom 0.13.0's
# Phase 1 and Phase 2 ship in the archive. No id Software data.
[upstream]
name = "Wojciech Graj"
url = "https://github.com/wojciech-graj/doom-ascii"

# the start script plays Freedoom: Phase 1 with -chars half -scaling 1
# from ${XDG_DATA_HOME:-~/.local/share}/freedoom, where the game keeps
# its settings and saves; "-iwad freedoom2.wad" plays Phase 2
[exec]
game = "freedoom"

# no [min_terminal]: the picture fits the terminal at 4:3; bigger is sharper

# 24-bit colour and the upper half block (U+2580); keyboard, and on Linux a
# gamepad, read from /dev/input with no package needed. Sound
# needs no package: the game loads ALSA or PulseAudio (Core Audio on macOS)
# when it starts and plays silently without them
[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = true

# 100x30, asciiverse/record-preview.py: Freedoom's title, then the game's
# own demos, then a quit through the menu; re-encoded at 12 fps
# (asciiverse/recast.py) from the game's 35; the still is a fight in a
# green-lit base
[media]
cast = "asciiverse/freedoom.cast"
thumbnail_at = 31.0

[release]
source = "github"
