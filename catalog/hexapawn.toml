schema_version = 1
id = "hexapawn"
kind = "game"
title = "Hexapawn"
description = "Three pawns a side on nine squares, against a machine that knows only the rules. Every game it loses, it strikes out the losing move for good. Beat it while you still can."
year = 1978
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "Martin Gardner invented Hexapawn in Scientific American in March 1962, for a machine of 24 matchboxes that learns to play it; R. A. Kaapke wrote the program, reworked by Jeff Dalton and Steve North for David H. Ahl's BASIC Computer Games (1978). Asciiverse rebuilt it from its rules in 2026."
topics = ["pawns", "learning", "machine-learning", "abstract", "basic-computer-games", "classic"]
genre = "board"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "hexapawn"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 70
rows = 22

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/hexapawn.cast"
thumbnail_at = 30.0

[release]
source = "github"
