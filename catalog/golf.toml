schema_version = 1
id = "golf"
kind = "game"
title = "Golf"
description = "Nine holes seen from above, with fairways, trees, sand, water and sloping greens. Pick the club, the aim and the swing, mind the wind, and bring your card in under par."
year = 1973
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "A golf game where you choose the club and how hard to swing was printed in David H. Ahl's 101 BASIC Computer Games (1973) and BASIC Computer Games (1978). Asciiverse rebuilt it from its rules in 2026."
topics = ["sports", "golf", "turn-based", "basic-computer-games", "classic"]
genre = "sports"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "golf"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/golf.cast"
thumbnail_at = 4.0

[release]
source = "github"
