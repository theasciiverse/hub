schema_version = 1
id = "sworn"
kind = "game"
title = "Sworn"
description = "Rise from lesser noble to king in the year 800: secret orders every season, letters that can lie, offers that bind and oaths you can break, against computer nobles or friends."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/sworn"
provenance = "Asciiverse wrote Sworn in 2026 from the premise of Warwick, the multiplayer terminal strategy game Lurebound announced in 2017 and never released."
topics = ["strategy", "diplomacy", "medieval", "multiplayer", "turn-based", "iroh"]
genre = "strategy"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# the archive holds sworn, README.md and LICENSE; games are saved in
# $XDG_STATE_HOME/sworn (autosave.sworn, and hosted.sworn for a game
# hosted for others)
[exec]
game = "sworn"
args = []

# drawn for 100x30; at 80x24 every province name still reads
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "256"
mouse = true
gamepad = false

# 100x30, recorded with hub/tools/castrec.py and --seed 7: a new game as
# Edmund of the Saxons, its first-season note, troops raised and three
# holds taken, the season's report, a neighbour's first letter, the
# crown's checklist, a second season; the still is the neighbour's letter
[media]
cast = "asciiverse/sworn.cast"
thumbnail_at = 37.5

[release]
source = "github"
