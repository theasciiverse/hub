schema_version = 1
id = "prince-toad"
kind = "game"
title = "Prince Toad"
description = "A prince turned toad hops roads, rivers and moats to kiss whatever waits on the far side, outruns a steamroller, a flood and a dragon, and at last finds the right princess."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/prince-toad"
provenance = "Asciiverse made Prince Toad in 2026 from David Sandquist's fairy tale of a toad prince who kisses everything in sight and finds his happy ending without the spell ever breaking."
topics = ["arcade", "lane-crossing", "story", "toad", "endless", "local-multiplayer", "gamepad", "rust"]
genre = "arcade"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# save and session log go to $XDG_STATE_HOME/prince-toad
[exec]
game = "prince-toad"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"
gamepad = true
system_deps = ["libasound2", "libudev1"]

# 100x30, `prince-toad --demo --crossing 13`: Mitten Pass and its kiss, then
# the boss road The Thaw rolling up the screen with the flood behind and the
# sleigh kiss (asciiverse/record-preview.sh)
[media]
cast = "asciiverse/prince-toad.cast"
thumbnail_at = 20.0

[release]
source = "github"
