schema_version = 1
id = "rogue-sea"
kind = "game"
title = "Rogue Sea"
description = "Sail a pirate ship across procedurally made seas, collect coconuts from the islands, fire cannonballs at other ships, and move on to a bigger ship"
year = 2021
# no licence file upstream; Ondrej Zara gave his permission for Asciiverse
# by email on 2026-11-13, kept with the game (PERMISSION.md and the .eml in
# asciiverse/permission/); rotty, the terminal runtime, is MIT
license = "LicenseRef-Author-Permission"
repo = "theasciiverse/rogue-sea"
provenance = "Ondřej Žára, the author of rot.js, made Rogue Sea in seven days for the 2021 Seven Day Roguelike Challenge, during a pandemic lockdown, as a browser game of square bitmap tiles."
changes = "PATCHES.md"
topics = ["roguelike", "7drl", "pirates", "naval", "sailing", "javascript"]
genre = "roguelike"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# built from github.com/ondras/rogue-sea at f4c357d (2026-07-29) by
# .github/workflows/release.yml: the browser game's script, unchanged, run
# by rotty (asciiverse/rotty) and QuickJS-ng as one native program
[upstream]
name = "Ondřej Žára (7DRL 2021)"
url = "https://github.com/ondras/rogue-sea"

# the session log goes to $XDG_STATE_HOME/rogue-sea;
# ROGUE_SEA_LOG=debug records every key; --seed N for the same seas
[exec]
game = "rogue-sea"

# the sea fills what the sidebar (a quarter) leaves; more is better
[min_terminal]
cols = 90
rows = 26

[requires]
utf8 = true
color = "truecolor"

# 100x30, recorded by asciiverse/record-preview.sh with --seed 3: the title
# page, the welcome notes, and sailing the first sea; the still is the ship
# by an island, at 24 s
[media]
cast = "asciiverse/rogue-sea.cast"
thumbnail_at = 24.0

[release]
source = "github"
