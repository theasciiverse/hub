schema_version = 1
id = "basketball"
kind = "game"
title = "Basketball"
description = "Coach a college team through two halves against Cedar State. Call the shot with the ball, call the defence without it, and read the press, the zone and the free throws."
year = 1967
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "Charles Bacheller wrote the basketball game at Dartmouth College in 1967; it went out through DECUS and David H. Ahl printed it in 101 BASIC Computer Games (1973) and BASIC Computer Games (1978). Asciiverse rebuilt it from its rules in 2026."
topics = ["sports", "basketball", "turn-based", "basic-computer-games", "classic"]
genre = "sports"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "basketball"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/basketball.cast"
thumbnail_at = 10.0

[release]
source = "github"
