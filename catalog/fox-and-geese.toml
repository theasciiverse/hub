schema_version = 1
id = "fox-and-geese"
kind = "game"
title = "Fox and Geese"
description = "One hungry fox, thirteen geese and a cross-shaped farmyard: jump the gaggle to pieces, or waddle in step by step and trap him. The old hunt game of the north!"
year = 2026
new = true
license = "GPL-3.0-or-later"
repo = "theasciiverse/ancient-games"
provenance = "A hunt game of northern Europe, named in an Icelandic saga and bought in silver-gilt for the household of Edward IV of England; Asciiverse made it in 2026 after R. C. Bell's rules of 1960."
topics = ["board", "hunt", "abstract", "medieval", "history", "vs-computer", "hot-seat"]
genre = "board"
collection = "ancient-games"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
