schema_version = 1
id = "hearts"
kind = "game"
title = "Hearts"
description = "Pass three, follow suit, and keep away from the hearts and the queen of spades, or take them all and shoot the moon: four at the table, the match to 100."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/tty-cards"
collection = "tty-cards"
provenance = "Pieczasz built tty.cards in Go with Charm's Bubble Tea and Wish in 2026, an SSH server dealing five card games to whoever connects."
changes = "PATCHES.md"
topics = ["hearts", "trick-taking", "card game", "go"]
genre = "card"

[developer]
name = "Pieczasz"
url = "https://github.com/Pieczasz/tty-cards"

# packaged by Asciiverse with the changes in PATCHES.md
# (theasciiverse/tty-cards): played on one machine against computer
# players, with no server or account
[upstream]
name = "Pieczasz"
url = "https://github.com/Pieczasz/tty-cards"

# opens on a setup screen: players at the table (exactly 4), enter to
# deal. --players N, --demo; session log in ~/.local/state/hearts
[exec]
game = "hearts"
args = []

# below this the tables ask for a bigger terminal
[min_terminal]
cols = 64
rows = 20

[requires]
utf8 = true
color = "truecolor"
mouse = false

# 100x30, asciiverse/record-preview.sh: --demo, the computer playing every
# seat; the still is a trick in play
[media]
cast = "asciiverse/hearts.cast"
thumbnail_at = 30.0

[release]
source = "github"
