title = "Mū tōrere"
description = "Four men each on an eight-armed star, one empty point, and nothing ever taken: block your rival until they cannot move. The Māori game of the East Coast, where one slip ends it."
year = 2026
new = true
license = "GPL-3.0-or-later"
repo = "theasciiverse/ancient-games"
provenance = "A game of Ngāti Porou on New Zealand's East Coast, its star drawn in charcoal on plank or bark; Tuta Nihoniho explained it to Elsdon Best, who published it in 1925. Asciiverse made it in 2026."
