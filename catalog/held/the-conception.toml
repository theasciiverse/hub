schema_version = 1
id = "the-conception"
kind = "game"
title = "The Conception"
description = "A cell's race through tunnels of living tissue on a hex map, past bacteria, platelets and fallen comrades, to reach the egg before your energy runs out"
year = 2013
# no licence file upstream; Ondrej Zara gave his permission for Asciiverse
# by email on 2026-11-13, kept with the game (PERMISSION.md and the .eml in
# asciiverse/permission/); rotty, the terminal runtime, is MIT
license = "LicenseRef-Author-Permission"
repo = "theasciiverse/the-conception"
provenance = "Ondřej Žára, the author of rot.js, made The Conception in seven days for the 2013 Seven Day Roguelike Challenge, a browser game on hexagons."
changes = "PATCHES.md"
topics = ["roguelike", "7drl", "hex", "humour", "biology", "rot.js", "javascript"]
genre = "roguelike"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# built from github.com/ondras/conception at 839f86e (2013-03-21) by
# .github/workflows/release.yml: the browser game's scripts, unchanged, run
# by rotty (asciiverse/rotty) and QuickJS-ng as one native program
[upstream]
name = "Ondřej Žára (7DRL 2013)"
url = "https://github.com/ondras/conception"

# the session log goes to $XDG_STATE_HOME/the-conception;
# THE_CONCEPTION_LOG=debug records every key; --seed N for the same tunnels
[exec]
game = "the-conception"

# the map fills what the column on the right leaves, so it plays at 80x24
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"

# 100x30, recorded by asciiverse/record-preview.sh with --seed 1: the title
# page, then the swim through the first tunnels; the still at 20 s
[media]
cast = "asciiverse/the-conception.cast"
thumbnail_at = 20.0

[release]
source = "github"
