schema_version = 1
id = "asshteroids"
kind = "game"
title = "ASSHTEROIDS"
description = "Asteroids where every ship in the field is someone: computer pilots who shoot back, or friends on your network flying in with plain ssh, all chasing the same rocks and the same top score."
year = 2026
license = "MIT"
repo = "theasciiverse/asshteroids"
provenance = "Tomas Zifcak wrote ASSHTEROIDS in Go between January and March 2026, an Asteroids field anyone could fly into with ssh, and ran it as a public server."
changes = "PATCHES.md"
topics = ["asteroids", "space", "shooter", "multiplayer", "lan", "ssh", "score-attack", "go"]
genre = "shooter"
new = true

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# upstream's main at 906a54b (2026-03-16), its newest commit; no tags;
# PATCHES.md in theasciiverse/asshteroids
[upstream]
name = "Tomas Zifcak"
url = "https://github.com/tomz197/asshteroids"

# with no arguments it plays here against three computer pilots and opens
# the field to the local network on port 2222 (or the next free one);
# best score and the SSH host key in $XDG_STATE_HOME/asshteroids, a
# session log with ASSHTEROIDS_LOG
[exec]
game = "asshteroids"
args = []

# the field scales to any size; the start screen needs 80x24
[min_terminal]
cols = 80
rows = 24

# half blocks and box drawing; the 8 colours and their bright versions;
# keyboard only
[requires]
utf8 = true
color = "basic"
mouse = false

# 100x30, asshteroids -demo -bots 6 (asciiverse/record-preview.sh): the
# autopilot and six computer pilots in one field, 32 s; the still is the
# ship among rocks with Vesta in view
[media]
cast = "asciiverse/asshteroids.cast"
thumbnail_at = 14.0

[release]
source = "github"
