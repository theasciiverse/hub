schema_version = 1
id = "nettoe"
kind = "game"
title = "netToe"
description = "Noughts and crosses against the computer at three levels, a friend at your keyboard, or a friend on another machine over the network."
year = 2000
license = "GPL-2.0-or-later"
repo = "theasciiverse/nettoe"
provenance = "Gabriele Giorgetti wrote netToe in C in 2000 and 2001, and Mats Erik Andersson maintained it until 2014."
changes = "PATCHES.md"
topics = ["board", "tic-tac-toe", "multiplayer", "lan", "hot-seat", "classic"]
genre = "board"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# Gabriele Giorgetti (2000 to 2001) and Mats Erik Andersson (2009 to 2014);
# 1.5.1 plus Debian 1.5.1-3 and Robert Berger's GCC 10 fix, built by
# .github/workflows/release.yml
[upstream]
name = "Gabriele Giorgetti and Mats Erik Andersson"
url = "https://nettoe.sourceforge.net/"

[exec]
game = "nettoe"

# line-based screens, drawn from the top left: 61 columns wide, the tallest
# (Info) 21 rows; a smaller terminal scrolls instead of failing
[min_terminal]
cols = 61
rows = 21

# ASCII, basic colours through terminfo, keyboard only; network play is
# direct TCP on port 7501, the host's firewall must let it in
[requires]
utf8 = false
color = "basic"
mouse = false

# 100x30, games against the computer on Normal played by
# asciiverse/record-preview.py; 42 s is a won game at 3 to 1
[media]
cast = "asciiverse/nettoe.cast"
thumbnail_at = 42.0

[release]
source = "github"
