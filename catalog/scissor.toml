schema_version = 1
id = "scissor"
kind = "game"
title = "Scissor"
description = "Rock, paper, scissors as a live action game: steer your scissor into papers and away from rocks"
license = "CC0-1.0 OR Apache-2.0"
repo = "theasciiverse/nbsdgames"
collection = "nbsdgames"
provenance = "abakh wrote Scissor for New BSD Games, a collection of small curses games in C."
changes = "PATCHES.md"
topics = ["action", "arcade", "rock-paper-scissors", "curses"]
genre = "action"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[upstream]
name = "abakh and contributors"
url = "https://github.com/abakh/nbsdgames"

[exec]
game = "scissor"

# the pieces move in an 80x24 area (LEN and WID in src/scissor.c)
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

# 100x30, played by asciiverse/record/scissor.py, which steers toward
# papers and away from rocks; 3 s has every kind of piece on screen
[media]
cast = "asciiverse/casts/scissor.cast"
thumbnail_at = 3.0

[release]
source = "github"
