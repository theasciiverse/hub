repo = "theasciiverse/ancient-games"
provenance = "Asciiverse made Mancala in Rust in 2026. Each of its nine games follows a source: the Oware Society's tournament rules, R. C. Bell (1960), E. W. Lane's account of Cairo (1836), W. J. Champion's Kalah patent (1955), M. Hellier on Malay congkak (1907), Mrs H. G. Durai on Pallanguli (1928), the Kazakh competition rules of 2013 and Fritz Jahn (1917)."
