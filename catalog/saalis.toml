schema_version = 1
id = "saalis"
kind = "game"
title = "Saalis"
description = "Fly, fight and trade in the Northern Reach: haul ore, smuggle stims past customs, board crippled raiders, and decide who gets what has waited two hundred years under a prospector's jumped claim."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/saalis"
provenance = "Asciiverse made Saalis in 2026 out of love for Ascii Sector and the space trading games before it, with a belt of its own; its name is Finnish for the catch, the prey and the plunder."
topics = ["space", "trading", "combat", "sandbox", "gamepad", "braille"]
genre = "simulation"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# saves and the session log go to $XDG_STATE_HOME/saalis
[exec]
game = "saalis"
args = []

# the game's own check
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = true
glyphs = ["braille"]
system_deps = ["libasound2", "libudev1"]

# 100x30, `saalis --demo --seed 7` (asciiverse/record-preview.sh)
[media]
cast = "asciiverse/saalis.cast"
thumbnail_at = 14.0

[release]
source = "github"
