schema_version = 1
id = "tessera"
kind = "game"
title = "Tessera"
description = "Mazes in four dimensions: every box on screen is one slice, and the way through runs between them. Twelve campaign mazes, a daily maze for everyone, and endless ones, in fog if you dare."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/tessera"
provenance = "Asciiverse made Tessera in Rust in 2026, after bleuje's browser 4D maze, which draws a four-dimensional maze as a grid of flat ones."
topics = ["puzzle", "maze", "4d", "daily", "gamepad"]
genre = "puzzle"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "tessera"
args = []

# the menus, the first six campaign mazes (turned to a view that fits where
# needed) and small endless ones; bigger mazes ask for more (src/render.rs
# needed()): the daily 71x39, the largest 95x39
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, hub/tools/castrec.py: the title, then Watch (--seed 7), the way
# through walked on 4x4x3x2 mazes, each turned to two other views on the
# way; the still is mid-walk
[media]
cast = "asciiverse/tessera.cast"
thumbnail_at = 12.0

[release]
source = "github"
