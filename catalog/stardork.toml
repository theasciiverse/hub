schema_version = 1
id = "stardork"
kind = "game"
title = "StarDork"
description = "Steer through a field of stars and probe the wormholes, by ship or by probe launcher. Every wormhole brings more stars. Reach level 30 to win."
year = 2011
license = "GPL-2.0-only"
repo = "theasciiverse/stardork"
provenance = "Ryan Kulla wrote StarDork in C and ncurses and released version 0.7 on SourceForge in 2011."
changes = "PATCHES.md"
topics = ["space", "stars", "wormholes", "turn-based", "shooter", "rust"]
genre = "arcade"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# Ryan Kulla's StarDork 0.7, ported to Rust so it needs no ncurses;
# licence from the SourceForge project page (the tarball has none).
[upstream]
name = "Ryan Kulla"
url = "https://sourceforge.net/projects/stardork/"

[exec]
game = "stardork"

# the ship starts at row 18, column 45 and the status line runs to
# column 61; the field is the terminal's size at start
[min_terminal]
cols = 64
rows = 20

# plain ASCII, white and red, keyboard only
[requires]
utf8 = false
color = "basic"
mouse = false

# 100x30, asciiverse/record-preview.sh: asciiverse/bot.py plays seed 1 to
# the win in 151 moves, replayed at watching speed, 58 s; the still is
# late in the game, the field thick with stars
[media]
cast = "asciiverse/stardork.cast"
thumbnail_at = 45.0

[release]
source = "github"
