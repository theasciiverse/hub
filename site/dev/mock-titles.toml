year = 1999
kind = "game"
title = "Terminal Orbit"
description = "The aliens are already here! Fly real Newtonian orbits across the solar system in a starfighter drawn in Braille, from the Moon to the rings of Saturn and all the way out to Pluto."
provenance = "Asciiverse ported Steve Belczyk's ORBIT, a 1999 OpenGL space combat simulator, from its original C source. The original campaign is all here, and the first part of Episode Two is new."
