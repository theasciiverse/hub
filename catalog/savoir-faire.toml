schema_version = 1
id = "savoir-faire"
kind = "adventure"
title = "Savoir-Faire"
description = "Charming, well dressed and broke, you slip into an empty chateau with one gift: you can link two things so that what happens to one happens to the other. Four XYZZY Awards."
year = 2002
license = "CC-BY-NC-ND-1.0"
repo = "theasciiverse/stories"
provenance = "Emily Short's Savoir-Faire (2002) is set in an alternate France where magic links like things to like."
changes = "savoir-faire/README.md"            # what Asciiverse changed, a path in repo
topics = ["text-adventure", "fantasy", "puzzle", "historical"]
genre = "text adventure"

[developer]
name = "Emily Short"
url = "https://ifarchive.org/if-archive/games/zcode/Savoir-Faire.zblorb"

# Emily Short's 2002 game, set in an alternate France where magic links like things to like.
# The story file is unchanged (provenance and sha256 in the stories repo,
# savoir-faire/README.md); played with Frotz 2.55, which comes inside the archive.
[upstream]
name = "Emily Short, 2002"
url = "https://ifarchive.org/if-archive/games/zcode/Savoir-Faire.zblorb"

# the start script plays the story in the bundled Frotz; saves go to
# ~/.local/share/savoir-faire
[exec]
game = "savoir-faire"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

[media]
cast = "asciiverse/savoir-faire.cast"
thumbnail_at = 18.1

[release]
source = "github"
