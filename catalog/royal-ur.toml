provenance = "Asciiverse made Royal Game of Ur in Rust in 2026. The rules are Irving Finkel's reconstructions from a Babylonian tablet of 177 or 176 BC, and R. C. Bell's from 1960."
topics = ["board", "race", "dice", "ancient", "history", "vs-computer", "hot-seat"]
genre = "board"
collection = "ancient-games"

