schema_version = 1
id = "lera"
kind = "program"
title = "Lera"
description = "Worlds running for decades, full of living players, one key away: pick a MUD from the list and you're in, with colour, scrollback that keeps the live text in view, and your vitals showing."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/lera"
provenance = "Asciiverse made Lera in 2026 to give every MUD in the catalog a home in your terminal, nearly fifty years after the first one; the name is Swedish for clay, which is to say mud."
topics = ["mud-client", "mud", "rust"]
genre = "mud client"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# av's Connect on a MUD runs `lera <world-id>`; on its own, `lera` opens the world picker
[exec]
game = "lera"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = true
color = "basic"
mouse = false

[media]
cast = "asciiverse/lera.cast"
thumbnail_at = 16.0

[release]
source = "github"
