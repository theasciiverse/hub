schema_version = 1
id = "civil-war"
kind = "game"
title = "Civil War"
description = "Fourteen battles from First Bull Run to Atlanta, with the armies history brought to each. Share out the treasury, choose how to fight, and see how your result stands against what really happened."
year = 1968
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "L. Cram, L. Goodie and D. Hibbard wrote Civil War at Lexington High School, Massachusetts, in 1968; G. Paul and R. Hess of TIES made it a two-player game, and David H. Ahl published it in BASIC Computer Games (1978). Asciiverse rebuilt it from its rules in 2026."
topics = ["history", "war", "strategy", "turn-based", "basic-computer-games", "classic"]
genre = "strategy"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "civil-war"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 90
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/civil-war.cast"
thumbnail_at = 8.0

[release]
source = "github"
