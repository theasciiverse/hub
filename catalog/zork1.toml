schema_version = 1
id = "zork1"
kind = "adventure"
title = "Zork I: The Great Underground Empire"
description = "Explore the Great Underground Empire for its treasures, starting by a white house"
year = 1980
license = "MIT"
repo = "theasciiverse/zork"
provenance = "Infocom released Zork I in 1980; Marc Blank, Dave Lebling, Bruce Daniels and Tim Anderson wrote it."
changes = "README.md"            # what Asciiverse changed, a path in repo
topics = ["text-adventure", "infocom", "classic", "fantasy"]
genre = "text adventure"

[developer]
name = "Infocom (Marc Blank, Dave Lebling, Bruce Daniels, Tim Anderson)"
url = "https://github.com/historicalsource/zork1"

# Infocom's 1980 release, unchanged; MIT-licensed by Microsoft on
# 2025-11-20. Played with Frotz 2.55, which comes inside the archive.
[upstream]
name = "Infocom, 1980"
url = "https://github.com/historicalsource/zork1"

# the start script plays zork1.z3 in the bundled Frotz; saves go to
# ~/.local/share/zork1
[exec]
game = "zork1"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

[media]
cast = "asciiverse/zork1.cast"
thumbnail_at = 9.0

[release]
source = "github"
