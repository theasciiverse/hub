[[title]]
id = "bsdtrek"
kind = "game"
title = "BSD Trek"
description = "Eric Allman's 1976 Star Trek for Unix: hunt Klingons by warp, phaser and torpedo"
provenance = "Eric Allman wrote Trek at UC Berkeley in 1976 and it shipped with BSD's games. Kenji Rikitake's bsdtrek later made the FreeBSD and DragonFly BSD version build on Linux."
genre = "strategy"
license = "BSD-3-Clause"
topics = ["strategy", "space", "classic", "teletype"]
thumbnail_at = 12.0
repo = "theasciiverse/bsdtrek"
developer = { name = "Asciiverse", url = "https://asciiverse.sh" }
upstream = { name = "Eric Allman, UC Berkeley (1976)", url = "https://github.com/jj1bdx/bsdtrek" }
exec = { game = "trek" }
requires = { utf8 = false, color = "basic", mouse = false }

