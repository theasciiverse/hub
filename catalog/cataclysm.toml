title = "Cataclysm"
description = "A plague of monsters swept New England and you survived it, barely: scavenge the dead towns, craft, build and drive, and dodge boomers, triffids and the Mi-go in Whales' original post-apocalyptic roguelike."
year = 2010
license = "CC-BY-SA-3.0"
repo = "theasciiverse/cataclysm"
