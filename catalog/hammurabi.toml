schema_version = 1
id = "hammurabi"
kind = "game"
title = "Hammurabi"
description = "Rule a city of ancient Sumer for ten years: buy land, open the granary, sow the fields, and outlast rats, plague and famine before the people pass judgement on your reign."
year = 1968
old = true
new = false
license = "MIT"
repo = "theasciiverse/bcg-games"
collection = "bcg-games"
provenance = "Mabel Addis's The Sumerian Game (1964) inspired The Sumer Game, written in FOCAL at DEC in 1968 and credited to Doug Dyment; David H. Ahl's BASIC Hamurabi carried it to a generation through BASIC Computer Games. Asciiverse rebuilt it from its rules in 2026."
topics = ["city-builder", "economy", "sumer", "turn-based", "basic-computer-games", "classic"]
genre = "strategy"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
game = "hammurabi"
args = []

# the game asks for a bigger window below this
[min_terminal]
cols = 76
rows = 22

[requires]
utf8 = true
color = "truecolor"
mouse = true
gamepad = true

system_deps = ["libasound2", "libudev1"]

# 100x30, asciiverse/record-previews.sh: --demo, the game playing itself
[media]
cast = "asciiverse/hammurabi.cast"
thumbnail_at = 24.0

[release]
source = "github"
