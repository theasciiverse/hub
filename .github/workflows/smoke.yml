# Installs av with the real installer from asciiverse.sh on macOS (Apple
# Silicon and Intel), Windows (x64 and ARM) and Linux (x64 and ARM), then
# installs and starts every title for that machine (tools/smoke.py). Shows
# what runs where without owning each machine. Weekly, and by hand with an
# optional list of titles.

name: smoke

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      titles:
        description: "title ids, space separated (empty: every title)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Libraries titles name in system_deps (Linux)
        if: runner.os == 'Linux'
        run: |
          deps=$(curl -fsSL https://asciiverse.sh/data/catalog.json \
            | python3 -c 'import json,sys; print(" ".join(sorted({d for t in json.load(sys.stdin)["titles"].values() for d in t.get("system_deps", [])})))')
          echo "system_deps: $deps"
          sudo apt-get update -qq
          for d in $deps; do
            sudo apt-get install -y -qq --no-install-recommends "$d" >/dev/null 2>&1 \
              && echo "installed $d" || echo "::warning::no package $d on $(lsb_release -ds)"
          done

      - name: Install av (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://asciiverse.sh/install.sh | AV_INSTALL=user sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install av (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://asciiverse.sh/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'Asciiverse\bin')
          python -m pip install --quiet pywinpty

      - name: Install and start every title
        shell: bash
        env:
          TITLES: ${{ github.event.inputs.titles }}
        run: |
          av --version
          python tools/smoke.py $TITLES
