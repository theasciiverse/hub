schema_version = 1
id = "alquerque"
kind = "game"
title = "Alquerque and Fanorona"
description = "Leap and take on the board of Alfonso X's Book of Games, then cross to Madagascar, where a single fanorona move can sweep a whole enemy line off the board!"
year = 2026
new = true
license = "GPL-3.0-or-later"
repo = "theasciiverse/ancient-games"
provenance = "Alfonso X of Castile had alquerque's first rules written down in 1283; fanorona, its Malagasy cousin on a doubled board, was played everywhere in Madagascar by 1886. Asciiverse brought both to the terminal in 2026."
topics = ["board", "capture", "abstract", "europe", "africa", "madagascar", "history", "vs-computer", "hot-seat"]
genre = "board"
collection = "ancient-games"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[exec]
