<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../vendor/asciinema-player/asciinema-player.css"><link rel="stylesheet" href="../css/site.css">
<style>body{margin:0;background:#000;color:#ccc;font:12px monospace}#g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
.c{background:#111}.c b{display:block;padding:2px 4px}.term{aspect-ratio:50/36}</style></head><body><div id="g"></div>
<script src="../vendor/asciinema-player/asciinema-player.min.js"></script><script src="../js/site.js"></script>
<script>
(async()=>{await document.fonts.load('16px "Iosevka Term AV"').catch(()=>{});
const ids=new URLSearchParams(location.search).get("ids").split(",");
for(const id of ids){const c=el(`<div class="c"><b>${id}</b><div class="term"></div></div>`);document.getElementById("g").append(c);
AsciinemaPlayer.create("../casts/"+id+".cast",c.querySelector(".term"),{...PLAYER_OPTS,fit:"both",poster:"npt:30"});}})();
</script></body></html>
