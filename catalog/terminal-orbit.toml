schema_version = 1
id = "terminal-orbit"
kind = "game"
title = "Terminal Orbit"
description = "The aliens are already here! Fly real Newtonian orbits across the solar system in a starfighter drawn in Braille, from the Moon to the rings of Saturn and all the way out to Pluto."
year = 1999
license = "GPL-2.0-or-later"
repo = "theasciiverse/terminal-orbit"
provenance = "Steve Belczyk released ORBIT in 1999, a free space combat simulator with Newtonian physics, a real solar system and missions players could write themselves. His whole campaign flies again here, with the first part of a new Episode Two."
topics = ["space", "simulation", "combat", "braille", "port"]
genre = "simulation"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[upstream]
name = "Steve Belczyk"
url = "http://genesis.nred.ma.us/orbit/"

# the archive holds terminal-orbit with its maps/, missions/ and models/
# folders, read from the install folder av starts it in
[exec]
game = "terminal-orbit"
args = []

# no [min_terminal]: it scales to the terminal and checks no minimum

[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = false
glyphs = ["braille"]

[media]
cast = "asciiverse/terminal-orbit.cast"
thumbnail_at = 14.0

[release]
source = "github"
