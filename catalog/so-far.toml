schema_version = 1
id = "so-far"
kind = "adventure"
title = "So Far"
description = "Hot, foul and dark: walk out of a stifling theatre, away from the woman who never came, into a chain of strange worlds. Andrew Plotkin's 'interactive catharsis'."
year = 1996
license = "LicenseRef-Free-Distribution"
repo = "theasciiverse/stories"
provenance = "Andrew Plotkin's So Far (1996) was nominated in the 1996 XYZZY Awards."
changes = "so-far/README.md"            # what Asciiverse changed, a path in repo
topics = ["text-adventure", "surreal", "puzzle", "classic"]
genre = "text adventure"

[developer]
name = "Andrew Plotkin"
url = "https://eblong.com/zarf/if.html"

# Andrew Plotkin's 1996 game, nominated in the 1996 XYZZY Awards.
# The story file is unchanged (provenance and sha256 in the stories repo,
# so-far/README.md); played with Frotz 2.55, which comes inside the archive.
[upstream]
name = "Andrew Plotkin, 1996"
url = "https://eblong.com/zarf/if.html"

# the start script plays the story in the bundled Frotz; saves go to
# ~/.local/share/so-far
[exec]
game = "so-far"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

[media]
cast = "asciiverse/so-far.cast"
thumbnail_at = 13.9

[release]
source = "github"
