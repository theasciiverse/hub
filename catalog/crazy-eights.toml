schema_version = 1
id = "crazy-eights"
kind = "game"
title = "Crazy Eights"
description = "Match the suit or the rank, slap down an eight to name the suit, and be the first to empty your hand against up to five computer players."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/tty-cards"
collection = "tty-cards"
provenance = "Pieczasz built tty.cards in Go with Charm's Bubble Tea and Wish in 2026, an SSH server dealing five card games to whoever connects."
changes = "PATCHES.md"
topics = ["crazy eights", "shedding", "card game", "go"]
genre = "card"

[developer]
name = "Pieczasz"
url = "https://github.com/Pieczasz/tty-cards"

# packaged by Asciiverse with the changes in PATCHES.md
# (theasciiverse/tty-cards): played on one machine against computer
# players, with no server or account
[upstream]
name = "Pieczasz"
url = "https://github.com/Pieczasz/tty-cards"

# opens on a setup screen: players at the table (2 to 6, 4 to start), enter to
# deal. --players N, --demo; session log in ~/.local/state/crazy-eights
[exec]
game = "crazy-eights"
args = []

# below this the tables ask for a bigger terminal
[min_terminal]
cols = 64
rows = 20

[requires]
utf8 = true
color = "truecolor"
mouse = false

# 100x30, asciiverse/record-preview.sh: --demo, the computer playing every
# seat; the still is the third player down to two cards
[media]
cast = "asciiverse/crazy-eights.cast"
thumbnail_at = 20.0

[release]
source = "github"
