schema_version = 1
id = "zork2"
kind = "adventure"
title = "Zork II: The Wizard of Frobozz"
description = "Deeper into the Great Underground Empire, where the Wizard of Frobozz whispers a word beginning with F and your day gets worse. A dragon, a unicorn, a robot and the Bank of Zork await."
year = 1981
old = true
license = "MIT"
repo = "theasciiverse/zork"
provenance = "Infocom released Zork II in 1981; Marc Blank, Dave Lebling, Bruce Daniels and Tim Anderson wrote it."
changes = "README.md"            # what Asciiverse changed, a path in repo
topics = ["text-adventure", "infocom", "classic", "fantasy"]
genre = "text adventure"

[developer]
name = "Infocom (Marc Blank, Dave Lebling, Bruce Daniels, Tim Anderson)"
url = "https://github.com/historicalsource/zork2"

# Infocom's 1981 release, unchanged; MIT-licensed by Microsoft on
# 2025-11-20. Played with Frotz 2.55, which comes inside the archive.
[upstream]
name = "Infocom, 1981"
url = "https://github.com/historicalsource/zork2"

# the start script plays zork2.z3 in the bundled Frotz; saves go to
# ~/.local/share/zork2
[exec]
game = "zork2"
args = []

[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

[media]
cast = "asciiverse/zork2.cast"
thumbnail_at = 8.0

[release]
source = "github"
