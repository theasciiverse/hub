year = 2014
license = "GPL-3.0-only"
repo = "theasciiverse/edigotia"
provenance = "Whales, the creator of Cataclysm, built Edigotia in the open in 2014 and 2015, nearly nine hundred commits, most of them poured into its living city and its economy."
