<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get av</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  .getav { margin-top: 22px; }
  .getav h1 { margin: 0 0 12px; font: 600 30px/1.15 var(--font-mono); }
  .getav h1 b { color: var(--green-hi); }
  .getav p { font-size: 15px; line-height: 1.6; max-width: 56ch; }
  .getav .av-get { margin: 4px 0 0; }
  .getav .av-get .install code { font-size: 14px; padding: 11px 12px; }

  .facts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; }
  .card h3 { margin: 0 0 8px; font: 600 14px var(--font-mono); color: var(--text); }
  .card p, .card li { color: var(--text-dim); font-size: 13.5px; line-height: 1.55; }
  .card p { margin: 0 0 8px; }
  .card ol, .card ul { margin: 0; padding-left: 18px; }
  .card code, .paths code { font: 12.5px var(--font-mono); color: var(--amber-soft); }
  .card pre { margin: 8px 0 0; background: var(--term-bg); border: 1px solid var(--line); padding: 10px 12px;
    font: 12.5px/1.55 var(--font-mono); color: var(--green-hi); white-space: pre-wrap; overflow-wrap: anywhere; }

  .paths { width: 100%; border-collapse: collapse; font-size: 13px; }
  .paths th, .paths td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .paths th { font: 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); font-weight: 500; }
  .paths td:first-child { color: var(--text); white-space: nowrap; }
  .paths td { color: var(--text-dim); }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); }
  .term-intro { color: var(--text-dim); font-size: 15px; line-height: 1.6; max-width: 72ch; margin: 0 0 4px; }
  .card ul li { margin-bottom: 3px; }
  .card b { color: var(--text); font-weight: 600; }
  .card em { color: var(--text); font-style: normal; }
  .picks { margin-top: 14px; }
  .cmds td:first-child { width: 1%; padding-right: 36px; }
  .cmds td:first-child code { color: var(--green-hi); }
  .cmds + .note { margin-top: 8px; }
  .card.keys { margin-top: 14px; }
  .card.keys > p { max-width: 90ch; }
  .card.keys .table-wrap { margin-top: 12px; background: var(--term-bg); }
  .card.keys .paths td:nth-child(2) { color: var(--text); white-space: nowrap; }
  .paths a { color: var(--green-hi); }
  .facts-grid.two { grid-template-columns: repeat(2, 1fr); }

  .onward { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 22px;
    border: 1px solid var(--line); background: var(--panel-2); }
  .way { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 26px 28px;
    color: var(--text); border-left: 1px solid var(--line); }
  .way:first-child { border-left: 0; }
  .way:hover { color: var(--text); background: var(--panel-3); }
  .way .glyph { font: 600 15px var(--font-mono); color: var(--green-hi); background: var(--term-bg);
    border: 1px solid var(--line-2); padding: 10px 16px; margin-bottom: 18px; }
  .way .glyph .p { color: var(--text-faint); }
  .way .glyph .a { color: var(--amber); animation: blink 1.1s steps(1) infinite; }
  .way h3 { margin: 0 0 10px; font: 600 22px var(--font-mono); }
  .way p { margin: 0 0 22px; color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 34ch; flex: 1; }
  .btn-out { font: 500 13px var(--font-mono); color: var(--text); border: 1px solid var(--text-dim);
    border-radius: var(--radius); padding: 8px 18px; }
  .way:hover .btn-out { border-color: var(--green-hi); color: var(--green-hi); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .way .glyph .a { animation: none; } }

  @media (max-width: 900px) {
    .facts-grid, .facts-grid.two, .onward { grid-template-columns: 1fr; }
    .way { border-left: 0; border-top: 1px solid var(--line); }
    .way:first-child { border-top: 0; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script src="js/site.js"></script>
<script>
(() => {
  const app = document.getElementById("app");
  app.append(header("Get av", "none"));
  const main = el(`<div class="wrap"></div>`);
  app.append(main);

  const hero = el(`<section class="getav">
    <div>
      <h1>Get <b>av</b></h1>
      <p>av is the Asciiverse client: the whole catalog in your terminal. Browse, watch previews, install, update and launch, on Linux, macOS and Windows, in whatever terminal you already use.</p>
      <p>Install it with one line:</p>
      <div class="slot"></div>
      <p class="note">One file, checked against its sha256 before it is put in place. No sudo, no administrator rights. Rather look before you run? Read <a href="install.sh">install.sh</a> or <a href="install.ps1">install.ps1</a>.</p>
    </div>
    <pre><span class="p">$</span> av
<span class="wm">▄▀█ █▀ █▀▀ █ █ █ █ █▀▀ █▀█ █▀ █▀▀
█▀█ ▄█ █▄▄ █ █ ▀▄▀ ██▄ █▀▄ ▄█ ██▄</span>

<span class="p">$</span> av install solitty
fetching solitty 1.4.1 <span class="d">(x86_64-unknown-linux-gnu)</span>
  <span class="g">██████████████████████████████</span><span class="a"> 100%  46 kB / 46 kB</span>
<span class="d">  checksum ok, extracting</span>
<span class="d">  installed to ~/.local/share/asciiverse/games/solitty</span>
<span class="p">$</span> solitty<span class="a">_</span></pre>
  </section>`);
  hero.querySelector(".slot").replaceWith(avInstaller());
  main.append(hero);

  // three ways onward, in the spirit of Oh My Zsh's plugins/community/themes row
  const onward = el(`<section class="onward">
    <a class="way" href="index.html"><div class="glyph"><span class="p">$</span> av<span class="a">_</span></div>
      <h3>The catalog</h3>
      <p>Games rebuilt from their original source, homages, originals and MUDs, each with a recording you can watch before you install.</p>
      <span class="btn-out">Browse <b class="n-titles">the</b> titles</span></a>
    <a class="way" href="submit.html"><div class="glyph"><span class="p">$</span> git push<span class="a">_</span></div>
      <h3>Makers</h3>
      <p>Made something for the terminal? Open or closed source, a pull request puts it in front of everyone who runs av.</p>
      <span class="btn-out">Submit a title</span></a>
    <a class="way" href="history.html"><div class="glyph"><span class="p">$</span> man history<span class="a">_</span></div>
      <h3>History</h3>
      <p>From games played on teletype paper to MUDs that have run for more than thirty years: where text games come from.</p>
      <span class="btn-out">Read the history</span></a>
  </section>`);
  main.append(onward);
  fetch("data/catalog.json").then(r => r.json()).then(c => {
    onward.querySelector(".n-titles").textContent = Object.keys(c.titles).length;
  }).catch(() => {});

  main.append(el(`<section class="sect">
    <div class="sect-head"><h2>What the installer does</h2></div>
    <div class="facts-grid">
      <div class="card"><h3>1. Picks your build</h3>
        <p>From your system and processor: Linux (a static build that runs on any distribution), macOS (Intel or Apple silicon) or Windows, each on x86_64 or ARM64.</p></div>
      <div class="card"><h3>2. Checks it</h3>
        <p>Downloads the archive and the published <code>SHA256SUMS</code>, and stops without installing anything if the checksum does not match.</p></div>
      <div class="card"><h3>3. Puts av in place</h3>
        <p>Linux and macOS: <code>~/.local/bin/av</code>. If that folder is not on your PATH yet, it prints the one line to add; it never edits your shell files.</p>
        <p>Windows: <code>%LOCALAPPDATA%\\Asciiverse\\bin\\av.exe</code>, added to your user PATH.</p></div>
    </div>
  </section>`));

  main.append(el(`<section class="sect">
    <div class="sect-head"><h2>Commands</h2><span class="sub">av on its own opens the catalog; everything it does also works from the shell</span></div>
    <div class="table-wrap"><table class="paths cmds">
      <tr><td><code>av</code></td><td>open the catalog and your library</td></tr>
      <tr><td><code>av install &lt;title&gt;...</code></td><td>install titles, or update them to the latest version</td></tr>
      <tr><td><code>av update [&lt;title&gt;...]</code></td><td>update these titles, or every title with an update</td></tr>
      <tr><td><code>av uninstall &lt;title&gt;...</code></td><td>remove titles; their saves and settings are kept</td></tr>
      <tr><td><code>av play &lt;title&gt;</code></td><td>start a title, or connect to a MUD</td></tr>
      <tr><td><code>av list [installed|updates|wishlist]</code></td><td>list the catalog, or part of it</td></tr>
      <tr><td><code>av search &lt;words&gt;</code></td><td>find titles by name, topic, genre or developer</td></tr>
      <tr><td><code>av info &lt;title&gt;</code></td><td>a title's details: version, developer, license, what it needs</td></tr>
    </table></div>
    <p class="note">A title is its id, as in <code>av install solitty</code>, or its full name in quotes.</p>
  </section>`));

  main.append(el(`<section class="sect">
    <div class="sect-head"><h2>Which terminal</h2><span class="sub">every title runs in the one you have; some play better in others</span></div>
    <p class="term-intro">Every title runs in any modern terminal on Linux, macOS and Windows, and most play exactly the same everywhere. Three things do differ between terminals, and for some titles they matter.</p>
    <div class="card keys"><h3>Action games: letting go of a key</h3>
      <p>Platformers and arcade games (Entity, Ceres, Panzer, tty-rex, Rusty Pinball and more) need to know the moment you <em>release</em> a key, not just when you press it. Some terminals tell the game exactly. The rest only send presses, and the game has to guess the release from the key repeats stopping: it still plays, but a held direction hesitates before it moves and every jump is a full jump. A gamepad avoids the question; av marks the titles that take one.</p>
      <div class="table-wrap"><table class="paths">
        <tr><th>Terminal</th><th>Exact key releases on</th><th></th></tr>
        <tr><td><a href="https://ghostty.org">Ghostty</a></td><td>Linux, macOS</td><td></td></tr>
        <tr><td><a href="https://sw.kovidgoyal.net/kitty/">kitty</a></td><td>Linux, macOS</td><td></td></tr>
        <tr><td><a href="https://wezterm.org">WezTerm</a></td><td>Linux, macOS, Windows</td><td>on Linux and macOS, add <code>config.enable_kitty_keyboard = true</code> to its config first</td></tr>
        <tr><td><a href="https://learn.microsoft.com/en-us/windows/terminal/">Windows Terminal</a></td><td>Windows</td><td>built into Windows 11</td></tr>
        <tr><td>Windows console</td><td>Windows</td><td>the classic console window</td></tr>
        <tr><td><a href="https://iterm2.com">iTerm2</a></td><td>macOS</td><td></td></tr>
        <tr><td><a href="https://codeberg.org/dnkl/foot">foot</a></td><td>Linux</td><td>Wayland only</td></tr>
        <tr><td><a href="https://alacritty.org">Alacritty</a></td><td>Linux, macOS</td><td></td></tr>
      </table></div></div>
    <div class="facts-grid two">
      <div class="card" id="fonts"><h3>Pictures made of characters</h3>
        <p>Many titles draw with Braille and block characters for detail finer than one character cell. Nearly every modern terminal shows these with any font.</p>
        <p>The newest, block octants (Unicode 16), are drawn by GNOME Terminal and other VTE 0.78+ terminals, Ghostty 1.1.1+, kitty 0.40+ and foot 1.20+. Titles that use them fall back to Braille and half blocks elsewhere.</p>
        <p>A few titles need other glyphs, like the characters on Mahjongg's tiles; terminal fonts nearly always fill those in automatically.</p></div>
      <div class="card"><h3>Colour and size</h3>
        <p>Titles use 24-bit colour where the terminal says it has it (<code>COLORTERM=truecolor</code>), and 256 colours otherwise.</p>
        <p>80x24 is the baseline. Some titles want more room, like Mahjongg's large tiles at about 100x40; av shows each title's minimum size on its page. A full-screen window or a smaller font both help.</p></div>
    </div>
    <div class="table-wrap picks"><table class="paths">
      <tr><th>Our picks</th><th>Linux</th><th>macOS</th><th>Windows</th></tr>
      <tr><td>For everything</td><td><a href="https://ghostty.org">Ghostty</a> or <a href="https://sw.kovidgoyal.net/kitty/">kitty</a></td><td><a href="https://ghostty.org">Ghostty</a> or <a href="https://sw.kovidgoyal.net/kitty/">kitty</a></td><td><a href="https://learn.microsoft.com/en-us/windows/terminal/">Windows Terminal</a></td></tr>
      <tr><td>Also good</td><td><a href="https://codeberg.org/dnkl/foot">foot</a>, <a href="https://wezterm.org">WezTerm</a>, <a href="https://alacritty.org">Alacritty</a></td><td><a href="https://iterm2.com">iTerm2</a>, <a href="https://wezterm.org">WezTerm</a>, <a href="https://alacritty.org">Alacritty</a></td><td><a href="https://wezterm.org">WezTerm</a>, the classic console</td></tr>
    </table></div>
  </section>`));

  main.append(el(`<section class="sect">
    <div class="sect-head"><h2>Where things go</h2><span class="sub">everything stays in your own folders</span></div>
    <div class="table-wrap"><table class="paths">
      <tr><th></th><th>Linux</th><th>macOS</th><th>Windows</th></tr>
      <tr><td>av itself</td><td><code>~/.local/bin/av</code></td><td><code>~/.local/bin/av</code></td><td><code>%LOCALAPPDATA%\\Asciiverse\\bin</code></td></tr>
      <tr><td>Installed titles</td><td><code>~/.local/share/asciiverse/</code></td><td><code>~/Library/Application Support/Asciiverse/</code></td><td><code>%LOCALAPPDATA%\\Asciiverse\\</code></td></tr>
      <tr><td>Cache (safe to delete)</td><td><code>~/.cache/asciiverse/</code></td><td><code>~/Library/Caches/Asciiverse/</code></td><td><code>%LOCALAPPDATA%\\Asciiverse\\cache\\</code></td></tr>
      <tr><td>Settings</td><td><code>~/.config/asciiverse/</code></td><td><code>~/Library/Application Support/Asciiverse/</code></td><td><code>%APPDATA%\\Asciiverse\\</code></td></tr>
    </table></div>
  </section>`));

  main.append(el(`<section class="sect">
    <div class="sect-head"><h2>Update and uninstall</h2></div>
    <div class="facts-grid">
      <div class="card"><h3>Manually update av</h3>
        <p>Run the install line again. It replaces the av binary and leaves your titles, saves and settings alone.</p></div>
      <div class="card"><h3>Uninstall on Linux or macOS</h3>
        <p>To remove your titles too, uninstall them in av first (that also removes their links in <code>~/.local/bin</code>), then remove av:</p>
        <pre>rm ~/.local/bin/av</pre></div>
      <div class="card"><h3>Uninstall on Windows</h3>
        <p>Uninstall titles in av first if you want them gone too. Then delete av's folder and remove it from your user PATH under "Edit environment variables for your account".</p>
        <pre>Remove-Item -Recurse "$env:LOCALAPPDATA\\Asciiverse\\bin"</pre></div>
    </div>
  </section>`));

  app.append(footer());
})();
</script>
</body>
</html>
