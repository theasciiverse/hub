schema_version = 1
id = "rusty-pinball"
kind = "game"
title = "Rusty Pinball"
description = "Pull the plunger on eight living pinball tables drawn in Braille lines: orbiting bumpers, a spinning triangle round a pyramid, planets that tug the ball, a real night sky, and multiball!"
year = 2010
license = "GPL-3.0-only"
repo = "theasciiverse/rusty-pinball"
provenance = "Brian Nenninger made Vector Pinball for Android in 2010, physics first and every table drawn in lines and circles, and has kept it growing ever since; its eight tables and their rules roll on here in Braille."
topics = ["pinball", "physics", "braille", "port"]
genre = "pinball"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

[upstream]
name = "Vector Pinball"
url = "https://github.com/dozingcat/Vector-Pinball"
git = "https://github.com/dozingcat/Vector-Pinball"

[exec]
game = "rusty-pinball"
args = []

# no [min_terminal]: it scales to the terminal and checks no minimum

[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = false
glyphs = ["braille"]

system_deps = ["libasound2"]

[media]
cast = "asciiverse/rusty-pinball.cast"
thumbnail_at = 5.0

[release]
source = "github"
