schema_version = 1
id = "the-clans"
kind = "game"
title = "The Clans"
description = "Raise a clan of four, fight your way down the mines, seize the town hall and build an empire, a few battles at a time, day after day. The BBS door game of war and intrigue, now on your own machine."
year = 1997
license = "GPL-2.0-or-later"
repo = "theasciiverse/the-clans"
provenance = "Allen Ussher wrote The Clans as a BBS door game in 1997 and played it out across InterBBS leagues of dial-up boards; he released the source in 2002, and the Synchronet developers keep it alive today."
changes = "PATCHES.md"
topics = ["bbs", "door-game", "fantasy", "rpg", "strategy", "multiplayer", "hot-seat", "ansi"]
genre = "strategy"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# built from Synchronet's src/doors/clans-src (sbbs 55526e5) with the
# changes in PATCHES.md
[upstream]
name = "Allen Ussher and the Synchronet developers"
url = "https://gitlab.synchro.net/main/sbbs/-/tree/master/src/doors/clans-src"
git = "https://gitlab.synchro.net/main/sbbs.git"

# the launcher keeps the village in the player's state folder, founds it on
# the first start and plays a local game (clans /L)
[exec]
game = "the-clans"

# the game draws an 80x25 screen
[min_terminal]
cols = 80
rows = 25

# ANSI art and box drawing in UTF-8, the 16 BBS colours
[requires]
utf8 = true
color = "basic"
mouse = false

# 100x30: a fresh village, a clan of four made, the village and the mines,
# then a fight; the still is a fight mid-way
[media]
cast = "asciiverse/the-clans.cast"
thumbnail_at = 60.0

[release]
source = "github"
