schema_version = 1
id = "westering"
kind = "game"
title = "Westering"
description = "Oregon or bust! Take a wagon party of five two thousand miles from Independence to the Willamette Valley in 1848, past seven rivers, cholera and the first snows on the passes."
year = 2026
new = true
license = "MIT"
repo = "theasciiverse/westering"
provenance = "A journey game in the line of The Oregon Trail, which Don Rawitsch, Bill Heinemann and Paul Dillenberger wrote for a Minneapolis history class in 1971; Asciiverse set it on the real road of 1848 in 2026."
topics = ["oregon trail", "journey", "history", "survival", "wagon", "1848", "rust"]
genre = "strategy"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# the archive holds westering, README.md and LICENSE; a journey under way
# is kept in $XDG_STATE_HOME/westering/journey.txt, the register of
# journeys made in journeys.txt beside it
[exec]
game = "westering"
args = []

# the text is set in a 72-column page; 24 rows fit every screen (the
# pictures show where there is room)
[min_terminal]
cols = 72
rows = 24

[requires]
utf8 = true
color = "truecolor"
mouse = false
gamepad = false

# 100x30, recorded with hub/tools/castrec.py and --seed 7: the title,
# outfitting in Independence, the first week, a deer stalked on the prairie,
# and the Kansas River; the still is the Kansas River's picture
[media]
cast = "asciiverse/westering.cast"
thumbnail_at = 40.0

[release]
source = "github"
