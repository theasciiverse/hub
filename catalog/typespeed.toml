schema_version = 1
id = "typespeed"
kind = "game"
title = "Typespeed"
description = "Words fly across the screen and you have to type them before they escape. Let ten get away and it's over. Climb from Beginner to 3l33t and *(GOD)*, in Unix commands, code or nine languages."
license = "GPL-2.0-or-later"
repo = "theasciiverse/typespeed"
provenance = "Typespeed is by Jani Ollikainen and Jaakko Manelius, later maintained by Tobias Stoeckmann; 0.6.5 (2008) was its last release."
changes = "PATCHES.md"            # what Asciiverse changed, a path in repo
topics = ["typing", "arcade", "multiplayer", "classic"]
genre = "typing"

[developer]
name = "Jani Ollikainen and Jaakko Manelius"
url = "https://typespeed.sourceforge.net/"

# 0.6.5, the last release, with Debian's patches and ours (scores without
# setgid, relocatable data); PATCHES.md in theasciiverse/typespeed
[upstream]
name = "Jani Ollikainen, Jaakko Manelius and Tobias Stoeckmann"
url = "https://typespeed.sourceforge.net/"

# the start script points typespeed at its bundled words and rules
[exec]
game = "typespeed"
stderr = "terminal"           # it refuses to start unless stderr is a terminal
args = []

# "You need at least 80 x 24 terminal!" (src/typespeed.c)
[min_terminal]
cols = 80
rows = 24

[requires]
utf8 = false
color = "basic"
mouse = false

[media]
cast = "asciiverse/typespeed.cast"
thumbnail_at = 33.0

[release]
source = "github"
